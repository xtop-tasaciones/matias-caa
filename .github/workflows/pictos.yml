name: Descargar pictogramas ARASAAC
on:
  push:
    branches: [main]
    paths: ['tools/pictos-queries.json', 'tools/fetch_pictos.py', 'pictos/index.json', 'tools/candidates.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pictos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python tools/fetch_pictos.py
      - name: Guardar pictogramas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pictos tools/candidates.png
          git diff --cached --quiet || (git commit -m "Pictogramas ARASAAC descargados" && git push)
